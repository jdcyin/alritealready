<script>
(function () {
  var words = ['ALRITE', 'BEEN', 'SEEN', 'SPREAD'];

  // ---------- about modal: shared between desktop and mobile ----------
  // aboutOpen pauses BOTH views' scroll loops. closeCurrentAbout is reassigned by
  // whichever view opened the modal, so the (shared) close button/backdrop always
  // does the right collapse-back animation for wherever it was triggered from.
  var aboutOpen = false;
  var aboutModal = document.getElementById('d-about-modal');
  var aboutBox = document.getElementById('d-about-box');
  var aboutCloseBtn = document.getElementById('d-about-close');
  var closeCurrentAbout = function () {};

  function showAboutBox() {
    aboutModal.style.pointerEvents = 'auto';
    aboutModal.style.opacity = '1';
    aboutBox.style.transform = 'scale(1)';
  }
  function hideAboutBox() {
    aboutModal.style.opacity = '0';
    aboutModal.style.pointerEvents = 'none';
    aboutBox.style.transform = 'scale(0.92)';
  }
  aboutCloseBtn.addEventListener('click', function () { closeCurrentAbout(); });
  aboutModal.addEventListener('click', function (e) {
    if (e.target === aboutModal) closeCurrentAbout();
  });

  // ---------- desktop: fit text to the available space, live ----------
  (function () {
    var measure = document.getElementById('d-measure');
    var suffixEl = document.getElementById('d-suffix');
    var aSlot = document.getElementById('d-a-slot');
    var aSlot2 = document.getElementById('d-a2-slot');
    var lSlot = document.getElementById('d-l-slot');
    var ySlot = document.getElementById('d-y-slot');
    var prefixEls = [document.getElementById('d-prefix-a'), document.getElementById('d-prefix-b')];
    var MARGIN = 10;   // px gap kept from each screen edge
    var MIN_SIZE = 40;
    var MAX_SIZE = 680;
    var REF = 200;      // reference size used to measure the width-per-character ratio

    function measureWidth(text, size) {
      measure.style.fontSize = size + 'px';
      measure.textContent = text;
      return measure.getBoundingClientRect().width;
    }

    function fit() {
      var W = window.innerWidth;
      var suffixW = measureWidth('ALREADY!', REF);
      var alriteW = measureWidth('ALRITE', REF);

      // size off the ALRITEALREADY! pairing specifically (not the widest-case SPREAD),
      // with a bit of headroom left over since SPREAD does still need to fit later
      var HEADROOM = 0.88;
      var size = HEADROOM * (W - 2 * MARGIN) / ((alriteW + suffixW) / REF);
      size = Math.max(MIN_SIZE, Math.min(size, MAX_SIZE));
      var scale = size / REF;

      // center the ALRITEALREADY! pairing specifically, as a whole block — the anchor
      // (where ALREADY! begins) stays fixed at this point for every word after that
      var suffixPx = suffixW * scale;
      var alritePx = alriteW * scale;
      var leftEdge = (W - (alritePx + suffixPx)) / 2;
      var anchorPx = leftEdge + alritePx;

      var letterAW = measureWidth('A', REF) * scale;
      var letterLW = measureWidth('L', REF) * scale;
      var letterYW = measureWidth('Y', REF) * scale;

      suffixEl.style.fontSize = size + 'px';
      suffixEl.style.left = anchorPx + 'px';
      suffixEl.style.right = 'auto';
      aSlot.style.width = letterAW + 'px';
      aSlot2.style.width = letterAW + 'px';
      lSlot.style.width = letterLW + 'px';
      ySlot.style.width = letterYW + 'px';
      prefixEls.forEach(function (el) {
        el.style.fontSize = size + 'px';
        el.style.right = (W - anchorPx) + 'px';
        el.style.left = 'auto';
      });
    }

    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fit, 80);
    });
  })();

  // ---------- desktop: direct scroll-following, smoothed, both directions, fixed step ----------
  (function () {
    // tune feel here:
    var STEP = 1 / 18;       // fixed pos-advance per wheel EVENT (ignores deltaY magnitude,
                              // so OS/trackpad scroll-acceleration can't make the distance-
                              // per-click drift) — 18 clicks per word, same every time
    var SMOOTH = 0.14;       // how quickly the rendered position catches up to raw scroll input —
                              // this is what makes a fast/choppy "mega scroll" glide instead of jump
    var EXIT_TRAVEL = 78;   // vw — outgoing word travels far, a real sweep across
    var ENTER_TRAVEL = 5;   // vw — incoming word only eases in from just beside
                             // ALREADY!, not from the screen edge

    // "A" morph icons — size (em, relative to the letter's own font-size) and vertical
    // nudge (%, negative = up) to line up with the surrounding letters' cap-height
    var PLANE_SIZE = 0.8;
    var PLANE_NUDGE = 0;
    var CAMERA_SIZE = 1;
    var CAMERA_NUDGE = -8;
    var BOOT_NUDGE = -4;      // up
    var BOOT_X_NUDGE = -4;    // left
    var BOOT_SCALE_X = 1.15;  // width — grows half as much as height
    var BOOT_SCALE_Y = 1.2;   // height — a few notches taller
    var CHEESE_SIZE = 1.05;
    var CHEESE_NUDGE = 0;
    var FORK_WIDTH = 0.96;   // wide — independent of height now, so this can grow
                              // without the fork exceeding the text's cap-height
    var FORK_HEIGHT = 0.79;
    var FORK_NUDGE = -1;
    var CAMERA_SPLIT = 90; // % the top/bottom halves travel apart as the camera exits

    var capture = document.getElementById('d-capture');
    var dLink = document.getElementById('d-link');
    var suffixEl = document.getElementById('d-suffix');
    var wordA = document.getElementById('d-prefix-a');
    var wordB = document.getElementById('d-prefix-b');
    var aboutEl = document.getElementById('d-about');
    var aLetter = document.getElementById('d-a-letter');
    var aPlane = document.getElementById('d-a-plane');
    var aCheese = document.getElementById('d-a-cheese');
    var lLetter = document.getElementById('d-l-letter');
    var lBoot = document.getElementById('d-l-boot');
    var aLetter2 = document.getElementById('d-a2-letter');
    var aCamera = document.getElementById('d-a-camera');
    var yLetter = document.getElementById('d-y-letter');
    var yFork = document.getElementById('d-y-fork');

      apply(mA2Letter, seenLegLetterOpacity, 0, 0);

      var distToFormed = slot === 1 ? 1 - frac : slot === 2 ? frac : 1;
      if (distToFormed < 0.02) {
        if (!mCameraFlashed) { mCameraFlashed = true; popFlash(mCameraFlash); }
      } else {
        mCameraFlashed = false;
      }
      var inSplitBand = slot === 2 && frac >= STEP && frac <= 3 * STEP;
      if (inSplitBand) {
        if (!mCameraSplitFlashed) { mCameraSplitFlashed = true; popFlash(mCameraTopFlash); }
      } else {
        mCameraSplitFlashed = false;
      }

      // Y: fork, bottom->top
      apply(mYLetter, spreadLegLetterOpacity, 0);
      axisMove(mYFork, spreadLegIconOpacity, slot, 2, 70, -70, 'y', FORK_NUDGE);
    }

    function frame() {
      if (!aboutOpen) {
        displayPos += (rawPos - displayPos) * SMOOTH;
        render(displayPos);
      }
      requestAnimationFrame(frame);
    }

    fit();
    requestAnimationFrame(frame);

    // entrance: ALRITE flows in top-down (from above), ALREADY! flows in bottom-up
    // (from below), meeting where they abut — mirrors the desktop left/right intro,
    // rotated to vertical. prefixA uses mIntroShiftY folded into the normal render
    // loop; suffixEl is animated directly since render() never sets its transform.
    (function playIntro() {
      var DUR = 1100;
      var travel = Math.min(window.innerHeight * 0.5, 420);
      mIntroShiftY = -travel;
      prefixA.style.opacity = 0;
      suffixEl.style.opacity = 0;
      suffixEl.style.transform = 'translateY(' + travel + 'px)';
      render(displayPos);

      var start = null;
      function step(ts) {
        if (start === null) start = ts;
        var t = Math.min(1, (ts - start) / DUR);
        var eased = 1 - Math.pow(1 - t, 3);
        mIntroShiftY = -travel * (1 - eased);
        prefixA.style.opacity = eased;
        suffixEl.style.opacity = eased;
        suffixEl.style.transform = 'translateY(' + (travel * (1 - eased)) + 'px)';
        render(displayPos);
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          mIntroShiftY = 0;
          prefixA.style.opacity = '';
          suffixEl.style.opacity = '';
          suffixEl.style.transform = '';
          render(displayPos);
        }
      }
      requestAnimationFrame(step);
    })();

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fit, 80);
    });

    function step(dir) {
      if (aboutOpen) return;
      rawPos += dir > 0 ? STEP : -STEP;
    }

    capture.addEventListener('wheel', function (e) {
      if (aboutOpen) return;
      e.preventDefault();
      step(e.deltaY);
    }, { passive: false });

    var touchStartY = null, touchAcc = 0;
    var TOUCH_STEP_PX = 34;
    capture.addEventListener('touchstart', function (e) {
      touchStartY = e.touches[0].clientY;
      touchAcc = 0;
    }, { passive: true });
    capture.addEventListener('touchmove', function (e) {
      if (aboutOpen || touchStartY === null) return;
      var y = e.touches[0].clientY;
      touchAcc += touchStartY - y;
      touchStartY = y;
      while (Math.abs(touchAcc) >= TOUCH_STEP_PX) {
        step(touchAcc > 0 ? 1 : -1);
        touchAcc += touchAcc > 0 ? -TOUCH_STEP_PX : TOUCH_STEP_PX;
      }
    }, { passive: true });

    // about: grabs the existing row/slot elements directly and only ever moves
    // them (never destroys their contents), so the suffix's icon machinery is
    // preserved through a scatter — render() then re-applies live state on close
    var mAboutEl = document.getElementById('m-about');
    var mScattered = [];

    function mobileOpenAbout() {
      if (aboutOpen) return;
      aboutOpen = true;
      var els = []
        .concat(Array.prototype.slice.call(prefixA.children))
        .concat(Array.prototype.slice.call(prefixB.children))
        .concat(Array.prototype.slice.call(suffixEl.children));
      mScattered = els;
      els.forEach(function (span) {
        span.style.transition = 'transform 0.7s cubic-bezier(.2,.7,.3,1), opacity 0.6s ease';
      });
      void win.getBoundingClientRect();
      els.forEach(function (span) {
        var dx = (Math.random() - 0.5) * window.innerWidth * 1.3;
        var dy = (Math.random() - 0.5) * window.innerHeight * 1.3;
        var rot = (Math.random() - 0.5) * 720;
        var delay = Math.random() * 140;
        setTimeout(function () {
          span.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) rotate(' + rot + 'deg)';
          span.style.opacity = '0';
        }, delay);
      });
      setTimeout(showAboutBox, 700);
    }

    function mobileCloseAbout() {
      hideAboutBox();
      mScattered.forEach(function (span) {
        span.style.transform = '';
        span.style.opacity = '';
      });
      setTimeout(function () {
        aboutOpen = false;
        mScattered = [];
        render(displayPos);
      }, 700);
    }

    mAboutEl.addEventListener('click', function () {
      closeCurrentAbout = mobileCloseAbout;
      mobileOpenAbout();
    });
  })();
})();
</script>
</body>
</html>
