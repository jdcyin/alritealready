<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Cormorant:ital,wght@1,500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #C9552C; }
    a:hover { color: #F3E4D0; }
  </style>
</helmet>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:#2b1710;font-family:'Cormorant',serif;">

  <!-- STATE 1: ALRITEALREADY -->
  <div style="position:absolute;left:0;top:0;width:720px;height:900px;overflow:hidden;background:
      radial-gradient(ellipse 1000px 800px at 30% 15%, rgba(201,85,44,0.35), transparent 60%),
      radial-gradient(ellipse 900px 700px at 80% 95%, rgba(243,228,208,0.10), transparent 55%),
      linear-gradient(165deg, #3a1f14 0%, #21120b 75%);">
    <!-- corner ticks -->
    <div style="position:absolute;top:36px;left:36px;width:14px;height:1px;background:rgba(243,228,208,0.4);"></div>
    <div style="position:absolute;top:36px;left:36px;width:1px;height:14px;background:rgba(243,228,208,0.4);"></div>
    <div style="position:absolute;bottom:36px;left:36px;width:14px;height:1px;background:rgba(243,228,208,0.4);"></div>
    <div style="position:absolute;bottom:36px;left:36px;width:1px;height:14px;background:rgba(243,228,208,0.4);"></div>
    <!-- horizon -->
    <div style="position:absolute;left:0;right:0;top:64%;height:1px;background:rgba(243,228,208,0.15);"></div>

    <div style="position:absolute;top:42px;right:44px;color:rgba(243,228,208,0.75);font-style:italic;font-size:16px;font-weight:500;">About</div>

    <div style="position:absolute;left:0;right:0;top:50%;height:120px;transform:translateY(-50%);">
      <span style="position:absolute;right:340px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:88px;letter-spacing:-0.005em;color:#C9552C;">ALRITE</span>
      <span style="position:absolute;left:380px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:88px;letter-spacing:-0.005em;color:#F3E4D0;">ALREADY</span>
    </div>

    <div style="position:absolute;bottom:48px;left:50%;transform:translateX(-50%);display:flex;gap:10px;">
      <div style="width:22px;height:3px;background:#C9552C;"></div>
      <div style="width:22px;height:3px;background:rgba(243,228,208,0.2);"></div>
      <div style="width:22px;height:3px;background:rgba(243,228,208,0.2);"></div>
      <div style="width:22px;height:3px;background:rgba(243,228,208,0.2);"></div>
    </div>
  </div>

  <!-- scroll divider -->
  <div style="position:absolute;left:720px;top:0;transform:translateX(-50%);height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;">
    <div style="width:1px;height:340px;background:repeating-linear-gradient(0deg, rgba(243,228,208,0.3) 0 6px, transparent 6px 12px);"></div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(243,228,208,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    <div style="writing-mode:vertical-rl;color:rgba(243,228,208,0.45);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-family:'Cormorant',serif;font-style:italic;">scroll</div>
    <div style="width:1px;height:340px;background:repeating-linear-gradient(0deg, rgba(243,228,208,0.3) 0 6px, transparent 6px 12px);"></div>
  </div>

  <!-- STATE 2: BEENALREADY -->
  <div style="position:absolute;left:720px;top:0;width:720px;height:900px;overflow:hidden;background:
      radial-gradient(ellipse 1000px 800px at 75% 20%, rgba(201,85,44,0.4), transparent 60%),
      radial-gradient(ellipse 900px 700px at 20% 95%, rgba(243,228,208,0.08), transparent 55%),
      linear-gradient(195deg, #3a1f14 0%, #21120b 75%);">
    <div style="position:absolute;top:36px;right:36px;width:14px;height:1px;background:rgba(243,228,208,0.4);"></div>
    <div style="position:absolute;top:36px;right:36px;width:1px;height:14px;background:rgba(243,228,208,0.4);"></div>
    <div style="position:absolute;bottom:36px;right:36px;width:14px;height:1px;background:rgba(243,228,208,0.4);"></div>
    <div style="position:absolute;bottom:36px;right:36px;width:1px;height:14px;background:rgba(243,228,208,0.4);"></div>
    <div style="position:absolute;left:0;right:0;top:64%;height:1px;background:rgba(243,228,208,0.15);"></div>

    <div style="position:absolute;top:42px;right:44px;color:rgba(243,228,208,0.75);font-style:italic;font-size:16px;font-weight:500;">About</div>

    <div style="position:absolute;left:-24px;top:50%;transform:translateY(-50%);font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:88px;color:rgba(201,85,44,0.14);letter-spacing:-0.005em;white-space:nowrap;">ALRITE</div>

    <div style="position:absolute;left:0;right:0;top:50%;height:120px;transform:translateY(-50%);">
      <span style="position:absolute;right:340px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:88px;letter-spacing:-0.005em;color:#C9552C;">BEEN</span>
      <span style="position:absolute;left:380px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:88px;letter-spacing:-0.005em;color:#F3E4D0;">ALREADY</span>
    </div>

    <div style="position:absolute;left:50%;top:calc(50% + 86px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#C9552C;border-radius:999px;padding:9px 18px;">
      <span style="color:#2b1710;font-size:15px;font-style:italic;">beenalready.com · travel</span>
    </div>

    <div style="position:absolute;bottom:48px;left:50%;transform:translateX(-50%);display:flex;gap:10px;">
      <div style="width:22px;height:3px;background:rgba(243,228,208,0.2);"></div>
      <div style="width:22px;height:3px;background:#C9552C;"></div>
      <div style="width:22px;height:3px;background:rgba(243,228,208,0.2);"></div>
      <div style="width:22px;height:3px;background:rgba(243,228,208,0.2);"></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
