<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@800;900&family=Newsreader:ital,wght@1,500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #E0311D; }
    a:hover { color: #16130F; }
  </style>
</helmet>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:#EDEAE3;font-family:'Libre Franklin',sans-serif;">

  <!-- STATE 1: ALRITEALREADY -->
  <div style="position:absolute;left:0;top:0;width:720px;height:900px;overflow:hidden;background:#EDEAE3;">
    <!-- desaturated photo placeholder -->
    <div style="position:absolute;inset:0;background:
        radial-gradient(ellipse 700px 900px at 25% 30%, rgba(60,58,54,0.14), transparent 62%),
        radial-gradient(ellipse 600px 700px at 85% 90%, rgba(60,58,54,0.08), transparent 55%);"></div>
    <!-- swiss grid -->
    <div style="position:absolute;left:240px;top:0;width:1px;height:900px;background:rgba(22,19,15,0.06);"></div>
    <div style="position:absolute;left:480px;top:0;width:1px;height:900px;background:rgba(22,19,15,0.06);"></div>
    <div style="position:absolute;left:0;top:56px;width:720px;height:1px;background:rgba(22,19,15,0.1);"></div>
    <div style="position:absolute;left:0;bottom:56px;width:720px;height:1px;background:rgba(22,19,15,0.1);"></div>

    <div style="position:absolute;top:32px;right:44px;color:rgba(22,19,15,0.7);font-family:'Newsreader',serif;font-style:italic;font-size:16px;">About</div>

    <div style="position:absolute;left:0;right:0;top:50%;height:100px;transform:translateY(-50%);">
      <span style="position:absolute;right:340px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:68px;letter-spacing:-0.01em;color:#E0311D;">ALRITE</span>
      <span style="position:absolute;left:380px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:68px;letter-spacing:-0.01em;color:#16130F;">ALREADY</span>
    </div>

    <div style="position:absolute;bottom:72px;left:50%;transform:translateX(-50%);display:flex;gap:10px;">
      <div style="width:22px;height:3px;background:#E0311D;"></div>
      <div style="width:22px;height:3px;background:rgba(22,19,15,0.15);"></div>
      <div style="width:22px;height:3px;background:rgba(22,19,15,0.15);"></div>
      <div style="width:22px;height:3px;background:rgba(22,19,15,0.15);"></div>
    </div>
  </div>

  <!-- scroll divider -->
  <div style="position:absolute;left:720px;top:0;transform:translateX(-50%);height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;">
    <div style="width:1px;height:340px;background:repeating-linear-gradient(0deg, rgba(22,19,15,0.2) 0 6px, transparent 6px 12px);"></div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(22,19,15,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    <div style="writing-mode:vertical-rl;color:rgba(22,19,15,0.35);font-size:10px;letter-spacing:0.24em;text-transform:uppercase;">scroll</div>
    <div style="width:1px;height:340px;background:repeating-linear-gradient(0deg, rgba(22,19,15,0.2) 0 6px, transparent 6px 12px);"></div>
  </div>

  <!-- STATE 2: BEENALREADY -->
  <div style="position:absolute;left:720px;top:0;width:720px;height:900px;overflow:hidden;background:#EDEAE3;">
    <div style="position:absolute;inset:0;background:
        radial-gradient(ellipse 700px 900px at 78% 25%, rgba(60,58,54,0.16), transparent 62%),
        radial-gradient(ellipse 600px 700px at 15% 90%, rgba(60,58,54,0.07), transparent 55%);"></div>
    <div style="position:absolute;left:240px;top:0;width:1px;height:900px;background:rgba(22,19,15,0.06);"></div>
    <div style="position:absolute;left:480px;top:0;width:1px;height:900px;background:rgba(22,19,15,0.06);"></div>
    <div style="position:absolute;left:0;top:56px;width:720px;height:1px;background:rgba(22,19,15,0.1);"></div>
    <div style="position:absolute;left:0;bottom:56px;width:720px;height:1px;background:rgba(22,19,15,0.1);"></div>

    <div style="position:absolute;top:32px;right:44px;color:rgba(22,19,15,0.7);font-family:'Newsreader',serif;font-style:italic;font-size:16px;">About</div>

    <div style="position:absolute;left:-20px;top:50%;transform:translateY(-50%);font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:68px;color:rgba(224,49,29,0.12);letter-spacing:-0.01em;white-space:nowrap;">ALRITE</div>

    <div style="position:absolute;left:0;right:0;top:50%;height:100px;transform:translateY(-50%);">
      <span style="position:absolute;right:340px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:68px;letter-spacing:-0.01em;color:#E0311D;">BEEN</span>
      <span style="position:absolute;left:380px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:68px;letter-spacing:-0.01em;color:#16130F;">ALREADY</span>
    </div>

    <div style="position:absolute;left:50%;top:calc(50% + 80px);transform:translateX(-50%);white-space:nowrap;">
      <span style="color:#E0311D;font-size:14px;letter-spacing:0.02em;border-bottom:1px solid #E0311D;padding-bottom:2px;">beenalready.com — travel</span>
    </div>

    <div style="position:absolute;bottom:72px;left:50%;transform:translateX(-50%);display:flex;gap:10px;">
      <div style="width:22px;height:3px;background:rgba(22,19,15,0.15);"></div>
      <div style="width:22px;height:3px;background:#E0311D;"></div>
      <div style="width:22px;height:3px;background:rgba(22,19,15,0.15);"></div>
      <div style="width:22px;height:3px;background:rgba(22,19,15,0.15);"></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
