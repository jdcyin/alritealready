<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@800;900&family=Big+Shoulders+Display:wght@100;300&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
  </style>
</helmet>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:#EDEAE3;font-family:'Libre Franklin',sans-serif;">

  <div style="position:absolute;left:480px;top:0;width:1px;height:900px;background:rgba(22,19,15,0.1);"></div>
  <div style="position:absolute;left:960px;top:0;width:1px;height:900px;background:rgba(22,19,15,0.1);"></div>

  <!-- COLUMN 1: BEENALREADY! — settled, centered -->
  <div style="position:absolute;left:0;top:0;width:480px;height:900px;overflow:hidden;">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <div style="display:flex;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:50px;letter-spacing:-0.01em;line-height:1;white-space:nowrap;">
        <span style="color:#E0311D;">BEEN</span><span style="color:#16130F;">ALREADY!</span>
      </div>
    </div>
    <div style="position:absolute;left:50%;bottom:64px;transform:translateX(-50%);color:rgba(22,19,15,0.4);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;white-space:nowrap;">settled</div>
  </div>

  <!-- COLUMN 2: mid-scroll — whole phrase sliding left and off -->
  <div style="position:absolute;left:480px;top:0;width:480px;height:900px;overflow:hidden;">
    <div style="position:absolute;left:0;top:50%;transform:translate(-58%,-50%);opacity:0.4;">
      <div style="display:flex;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:50px;letter-spacing:-0.01em;line-height:1;white-space:nowrap;">
        <span style="color:#E0311D;">BEEN</span><span style="color:#16130F;">ALREADY!</span>
      </div>
    </div>
    <div style="position:absolute;left:100%;top:50%;transform:translate(-42%,-50%);opacity:0.4;">
      <div style="display:flex;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:50px;letter-spacing:-0.01em;line-height:1;white-space:nowrap;">
        <span style="color:#E0311D;">SEEN</span><span style="color:#16130F;">ALREADY!</span>
      </div>
    </div>
    <div style="position:absolute;left:50%;bottom:64px;transform:translateX(-50%);color:rgba(22,19,15,0.4);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;white-space:nowrap;">sliding — whole phrase, ~350ms ease</div>
  </div>

  <!-- COLUMN 3: SEENALREADY! — settled, centered -->
  <div style="position:absolute;left:960px;top:0;width:480px;height:900px;overflow:hidden;">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <div style="display:flex;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:50px;letter-spacing:-0.01em;line-height:1;white-space:nowrap;">
        <span style="color:#E0311D;">SEEN</span><span style="color:#16130F;">ALREADY!</span>
      </div>
    </div>
    <div style="position:absolute;left:50%;bottom:64px;transform:translateX(-50%);color:rgba(22,19,15,0.4);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;white-space:nowrap;">settled</div>
  </div>
</div>
</x-dc>
</body>
</html>
