<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Space+Mono:wght@400;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #FF3EC9; }
    a:hover { color: #4DF0FF; }
  </style>
</helmet>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:#080a12;font-family:'Space Mono',monospace;">

  <!-- STATE 1: ALRITEALREADY -->
  <div style="position:absolute;left:0;top:0;width:720px;height:900px;overflow:hidden;background:
      radial-gradient(ellipse 900px 700px at 25% 20%, rgba(255,62,201,0.16), transparent 60%),
      radial-gradient(ellipse 800px 700px at 75% 90%, rgba(77,240,255,0.10), transparent 55%),
      linear-gradient(160deg, #0e1220 0%, #06070d 75%);">
    <!-- dot grid -->
    <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(77,240,255,0.10) 1px, transparent 1px);background-size:26px 26px;"></div>
    <!-- scanlines -->
    <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px);"></div>

    <div style="position:absolute;top:44px;right:44px;color:rgba(77,240,255,0.7);font-size:11px;letter-spacing:0.18em;">ABOUT_</div>

    <div style="position:absolute;left:0;right:0;top:50%;height:100px;transform:translateY(-50%);">
      <span style="position:absolute;right:339px;top:50%;transform:translate(2px,calc(-50% - 3px));white-space:nowrap;font-family:'Unbounded',sans-serif;font-weight:900;font-size:60px;letter-spacing:-0.01em;color:#4DF0FF;opacity:0.55;mix-blend-mode:screen;">ALRITE</span>
      <span style="position:absolute;right:340px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Unbounded',sans-serif;font-weight:900;font-size:60px;letter-spacing:-0.01em;color:#FF3EC9;">ALRITE</span>
      <span style="position:absolute;left:380px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Unbounded',sans-serif;font-weight:900;font-size:60px;letter-spacing:-0.01em;color:#4DF0FF;">ALREADY</span>
    </div>

    <div style="position:absolute;bottom:48px;left:50%;transform:translateX(-50%);display:flex;gap:10px;">
      <div style="width:22px;height:3px;background:#FF3EC9;"></div>
      <div style="width:22px;height:3px;background:rgba(77,240,255,0.2);"></div>
      <div style="width:22px;height:3px;background:rgba(77,240,255,0.2);"></div>
      <div style="width:22px;height:3px;background:rgba(77,240,255,0.2);"></div>
    </div>
  </div>

  <!-- scroll divider -->
  <div style="position:absolute;left:720px;top:0;transform:translateX(-50%);height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;">
    <div style="width:1px;height:340px;background:repeating-linear-gradient(0deg, rgba(77,240,255,0.35) 0 6px, transparent 6px 12px);"></div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(77,240,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    <div style="writing-mode:vertical-rl;color:rgba(77,240,255,0.45);font-size:10px;letter-spacing:0.28em;">SCROLL</div>
    <div style="width:1px;height:340px;background:repeating-linear-gradient(0deg, rgba(77,240,255,0.35) 0 6px, transparent 6px 12px);"></div>
  </div>

  <!-- STATE 2: BEENALREADY -->
  <div style="position:absolute;left:720px;top:0;width:720px;height:900px;overflow:hidden;background:
      radial-gradient(ellipse 900px 700px at 78% 30%, rgba(255,62,201,0.2), transparent 60%),
      radial-gradient(ellipse 800px 700px at 20% 90%, rgba(77,240,255,0.10), transparent 55%),
      linear-gradient(200deg, #0e1220 0%, #06070d 75%);">
    <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(77,240,255,0.10) 1px, transparent 1px);background-size:26px 26px;"></div>
    <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px);"></div>

    <div style="position:absolute;top:44px;right:44px;color:rgba(77,240,255,0.7);font-size:11px;letter-spacing:0.18em;">ABOUT_</div>

    <div style="position:absolute;left:-24px;top:50%;transform:translateY(-50%);font-family:'Unbounded',sans-serif;font-weight:900;font-size:60px;color:rgba(255,62,201,0.14);letter-spacing:-0.01em;white-space:nowrap;">ALRITE</div>

    <div style="position:absolute;left:0;right:0;top:50%;height:100px;transform:translateY(-50%);">
      <span style="position:absolute;right:339px;top:50%;transform:translate(2px,calc(-50% - 3px));white-space:nowrap;font-family:'Unbounded',sans-serif;font-weight:900;font-size:60px;letter-spacing:-0.01em;color:#4DF0FF;opacity:0.55;mix-blend-mode:screen;">BEEN</span>
      <span style="position:absolute;right:340px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Unbounded',sans-serif;font-weight:900;font-size:60px;letter-spacing:-0.01em;color:#FF3EC9;">BEEN</span>
      <span style="position:absolute;left:380px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Unbounded',sans-serif;font-weight:900;font-size:60px;letter-spacing:-0.01em;color:#4DF0FF;">ALREADY</span>
    </div>

    <div style="position:absolute;left:50%;top:calc(50% + 74px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;border:1px solid rgba(77,240,255,0.4);padding:8px 14px;">
      <span style="color:#4DF0FF;font-size:12px;letter-spacing:0.04em;">[ beenalready.com — travel ]</span>
    </div>

    <div style="position:absolute;bottom:48px;left:50%;transform:translateX(-50%);display:flex;gap:10px;">
      <div style="width:22px;height:3px;background:rgba(77,240,255,0.2);"></div>
      <div style="width:22px;height:3px;background:#FF3EC9;"></div>
      <div style="width:22px;height:3px;background:rgba(77,240,255,0.2);"></div>
      <div style="width:22px;height:3px;background:rgba(77,240,255,0.2);"></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
